<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — Área administrativa</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/auth.css"><script defer src="/assets/auth.js"></script></head><body class="auth-page" data-auth-page="reset"><main class="auth-wrap"><a href="/" class="auth-logo"><img src="/assets/logo-claro.png" alt="Logo da operadora"></a><section class="auth-card card"><header class="auth-heading"><span class="auth-icon">▣</span><div><h1>Nova senha</h1><p>Crie uma senha forte para sua conta</p></div></header><div id="reset-invalid" class="auth-success" hidden><p>Este link não é válido para redefinição de senha. Solicite um novo link através da tela de login.</p><a class="button button-outline" href="/forgot-password">Solicitar novo link</a></div><form id="reset-form" class="auth-form" hidden><label>Nova senha<input name="senha" type="password" minlength="6" required><small>Mínimo de 6 caracteres.</small></label><label>Confirmar nova senha<input name="confirmar" type="password" minlength="6" required></label><button class="button button-primary button-large" type="submit">Salvar nova senha</button></form><p id="auth-message" class="form-message" hidden></p></section><p class="auth-back"><a href="/auth">← Voltar para o login</a></p></main></body></html>
