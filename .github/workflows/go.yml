name: Go verification

on:
  push:
    branches:
      - refactor/go-vanilla
      - refactor/gateways-webhooks-snapshot
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./internal/payment ./internal/gateway/...
      - name: Vet
        run: go vet ./...
