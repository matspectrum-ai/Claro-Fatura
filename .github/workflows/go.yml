name: Go verification

on:
  push:
    branches:
      - 'refactor/**'
      - 'perf/**'
      - 'infra/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Vendor pinned frontend assets
        run: |
          bash scripts/fetch-sheetjs.sh
          bash scripts/fetch-qrcode.sh
      - name: JavaScript syntax
        run: |
          node --check internal/httpapi/web/assets/home.js
          node --check internal/httpapi/web/assets/invoice.js
          node --check internal/httpapi/web/assets/auth.js
          node --check internal/httpapi/web/assets/admin.js
          node --check internal/httpapi/web/assets/admin-activity.js
          node --check internal/httpapi/web/assets/admin-gateways.js
          node --check internal/httpapi/web/assets/vendor/qrcode.min.js
      - name: Deployment script syntax
        run: bash -n deploy/bootstrap-vps.sh deploy/release.sh deploy/rollback.sh
      - name: Nginx configuration syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sed 's/__DOMAIN__/example.invalid/g' deploy/nginx/claro-fatura.conf > /tmp/claro-fatura.conf
          printf 'events {}\nhttp { include /tmp/claro-fatura.conf; }\n' > /tmp/nginx-test.conf
          sudo nginx -t -c /tmp/nginx-test.conf
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./internal/payment ./internal/gateway/... ./internal/httpapi ./internal/admin ./internal/legacy
      - name: Vet
        run: go vet ./...
      - name: Graceful shutdown smoke
        run: |
          go build -o /tmp/claro-fatura-smoke ./cmd/server
          SUPABASE_URL=http://127.0.0.1:9 \
          SUPABASE_SERVICE_ROLE_KEY=test \
          ADDR=127.0.0.1:18080 \
          /tmp/claro-fatura-smoke >/tmp/claro-fatura-smoke.log 2>&1 &
          pid=$!
          cleanup() { kill -KILL "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          healthy=0
          for _ in $(seq 1 20); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:18080/healthz >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat /tmp/claro-fatura-smoke.log
            exit 1
          fi
          kill -TERM "$pid"
          wait "$pid"
          trap - EXIT
          grep -q 'shutdown complete' /tmp/claro-fatura-smoke.log
      - name: Static production build
        run: |
          mkdir -p artifacts
          bash scripts/build.sh artifacts/claro-fatura
          sha256sum artifacts/claro-fatura | tee artifacts/claro-fatura.sha256
          ls -lh artifacts/claro-fatura
      - uses: actions/upload-artifact@v4
        with:
          name: claro-fatura-linux-amd64
          path: |
            artifacts/claro-fatura
            artifacts/claro-fatura.sha256
          if-no-files-found: error
          retention-days: 14
