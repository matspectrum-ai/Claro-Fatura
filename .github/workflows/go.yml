name: Go verification

on:
  push:
    branches:
      - 'refactor/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Vendor pinned SheetJS
        run: bash scripts/fetch-sheetjs.sh
      - name: JavaScript syntax
        run: |
          node --check internal/httpapi/web/assets/home.js
          node --check internal/httpapi/web/assets/invoice.js
          node --check internal/httpapi/web/assets/auth.js
          node --check internal/httpapi/web/assets/admin.js
          node --check internal/httpapi/web/assets/admin-activity.js
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./internal/payment ./internal/gateway/... ./internal/httpapi ./internal/admin
      - name: Vet
        run: go vet ./...
      - name: Static production build
        run: |
          bash scripts/build.sh /tmp/claro-fatura
          ls -lh /tmp/claro-fatura
